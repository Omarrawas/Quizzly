name: quizzly
description: "كويزلي"
publish_to: 'none' 
version: 1.0.5+6

environment:
  sdk: ^3.11.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  smooth_page_indicator: ^2.0.1
  google_fonts: ^8.0.2
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.2
  cloud_firestore: ^6.3.0
  csv: ^6.0.0
  file_picker: ^8.1.4
  file_saver: ^0.2.12
  excel: ^4.0.6
  pdf: ^3.12.0
  printing: ^5.14.3
  barcode: ^2.2.9
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  flutter_math_fork: ^0.7.4
  video_player: ^2.9.1
  chewie: ^1.8.5
  youtube_player_flutter: ^9.1.1
  flutter_inappwebview: ^6.1.5
  youtube_explode_dart: ^3.0.5
  pointer_interceptor: ^0.10.1+1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  universal_html: ^2.1.0
  audioplayers: ^6.1.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  rxdart: ^0.28.0
  url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter
  flutter_quill: any
  flutter_quill_extensions: any
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  flutter_widget_from_html: ^0.17.2
  # ── Offline Video Download ──────────────────────────────
  dio: ^5.7.0
  path_provider: ^2.1.3
  crypto: ^3.0.3
  screen_protector: ^1.5.1
  uuid: ^4.4.0
  mobile_scanner: ^6.0.4
  package_info_plus: ^8.1.1
  firebase_remote_config: ^6.4.0
  share_plus: ^12.0.2
  device_info_plus: ^12.4.0
  app_links: ^6.3.2
  firebase_storage: ^13.4.2
  flutter_image_compress: ^2.4.0
  pasteboard: ^0.5.0

  # ── Math Equation Editor ────────────────────────────────
  math_keyboard: ^0.3.1
  flutter_bloc: ^8.1.6
  easy_latex: ^1.0.2
  equatable: ^2.0.5
  bloc: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:


  uses-material-design: true

  assets:
    - assets/icons/google_logo.png
    - assets/images/logo.png
    - assets/fonts/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

# ── Local patch: fixes "custom numFmtId starts at 164" error ──────────────────
# The upstream excel package throws when numFmtId < 164 (e.g. files from
# LibreOffice / Google Sheets). Our local copy skips those entries instead.
dependency_overrides:
  excel:
    path: packages/excel
